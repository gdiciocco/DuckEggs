<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64">
  <title>DuckEggs compact mark</title>
  <desc>A high-contrast sumi-e recoil silhouette with a cracked egg and
  golden impact for small icons.</desc>

  <!-- Keep the paper silhouette generous so the ink reads on dark chrome. -->
  <path d="M18 4
           C31 0 49 5 57 17
           C64 30 62 47 52 57
           C42 65 22 64 11 55
           C2 46 1 31 6 20
           C9 12 12 7 18 4Z"
        fill="#F1E5C8"/>

  <!-- Golden impact is one uninterrupted diagonal at thumbnail scale. -->
  <path d="M31 13
           C38 10 47 8 58 5
           L48 13
           L60 17
           L46 20
           L53 27
           L39 23
           L34 32
           L30 22Z"
        fill="#F7C600"/>
  <path d="M49 29 L57 33 L51 37Z" fill="#F7C600"/>
  <circle cx="60" cy="9" r="2.6" fill="#F7C600"/>
  <circle cx="45" cy="6" r="1.7" fill="#F7C600"/>

  <!-- Low, broad shoulder mass makes the backward recoil legible. -->
  <path d="M7 59
           C9 49 16 42 26 39
           L35 44
           C41 46 48 50 51 58Z"
        fill="#161513"/>

  <!-- Hair and face form one strong ink profile tipped into the blow. -->
  <path d="M11 38
           C5 32 5 23 10 17
           C8 12 12 8 18 8
           C20 3 28 3 31 7
           C37 5 42 10 42 15
           C35 15 30 18 28 23
           C26 27 27 32 25 36
           C21 41 15 42 11 38Z"
        fill="#161513"/>
  <path d="M26 18
           C31 15 38 15 44 20
           C50 25 53 33 50 40
           C48 45 43 47 38 45
           C32 43 29 37 27 31
           C26 27 25 22 26 18Z"
        fill="#F9F1DF"
        stroke="#161513"
        stroke-width="2.6"
        stroke-linejoin="round"/>

  <!-- One eye reads as light, the squeezed eye as a sharp ink notch. -->
  <ellipse cx="35" cy="25" rx="2.6" ry="3.8" fill="#161513"/>
  <path d="M41 23
           C43 20 47 20 49 23
           C47 22 44 23 43 26"
        fill="none"
        stroke="#161513"
        stroke-width="2.3"
        stroke-linecap="round"/>
  <path d="M38 35
           C40 33 44 34 45 37
           C45 40 41 42 39 40
           C37 39 37 37 38 35Z"
        fill="#161513"/>

  <!-- Oversized white shell fragment and cracked edge survive 16 px. -->
  <path d="M20 16
           L24 9
           L30 11
           L34 8
           L38 14
           L34 19
           L28 18Z"
        fill="#FFF9EC"
        stroke="#161513"
        stroke-width="2.2"
        stroke-linejoin="round"/>
  <path d="M25 11 L27 15 L24 17"
        fill="none"
        stroke="#161513"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Two ink flecks extend the gesture without becoming noise. -->
  <g fill="#161513">
    <path d="M8 38 C3 36 1 32 1 27 C4 30 6 32 10 33Z"/>
    <path d="M13 42 C7 44 5 49 7 53 C9 48 12 46 17 45Z"/>
  </g>
</svg>
