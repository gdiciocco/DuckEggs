name: Windows portable build

on:
  push:
  pull_request:

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-release --parallel
      - name: Test
        run: ctest --preset windows-release
      - name: Package
        working-directory: out/build/windows-msvc
        run: cpack -C Release
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Schiva-Adattivo-Cpp-windows-x64
          path: out/build/windows-msvc/Schiva-Adattivo-Cpp-*-windows-x64.zip
          if-no-files-found: error
